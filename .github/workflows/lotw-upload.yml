name: LoTW Auto Upload

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  batch-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger batch upload for all users
        run: |
          curl -X POST "${{ secrets.API_URL }}/api/qso/upload/lotw/admin/batch" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"