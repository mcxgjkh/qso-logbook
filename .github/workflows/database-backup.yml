name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Supabase CLI
        run: |
          npm install -g supabase
          supabase --version

      - name: Generate backup
        run: |
          supabase db dump --link ${{ secrets.SUPABASE_PROJECT_REF }} \
            -o backup-$(date +'%Y%m%d-%H%M%S').sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload encrypted backup to Vercel Blob
        run: node scripts/upload-backup.js
        env:
          VERCEL_BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_READ_WRITE_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Clean up backup files
        run: rm -f backup-*.sqls