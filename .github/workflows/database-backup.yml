name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 UTC 2:00
  workflow_dispatch:     # 支持手动触发

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          npm install -g supabase
          supabase --version

      - name: Generate backup
        run: |
          # 使用 supabase db dump 导出数据库
          supabase db dump --link ${{ secrets.SUPABASE_PROJECT_REF }} \
            -o backup-$(date +'%Y%m%d-%H%M%S').sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload to Vercel Blob
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backup-*.sql

      - name: Upload to Vercel Blob (via Node.js script)
        run: |
          node scripts/upload-backup.js
        env:
          VERCEL_BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_READ_WRITE_TOKEN }}